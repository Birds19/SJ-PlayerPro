name: Build SJ Player Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          if [ -f "SJPlayerPro.zip" ]; then
            unzip -o SJPlayerPro.zip -d .
            echo "Unzipped SJPlayerPro.zip"
          else
            echo "SJPlayerPro.zip not found in repo root - assuming source already unzipped"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (no wrapper jar needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SJPlayerPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # GitHub Actions does NOT allow `secrets.X` directly inside an `if:`
      # condition ("Unrecognized named-value: 'secrets'" - it's only valid
      # inside `env:` or `run:`). So we read the secret into an env var here,
      # and expose a step OUTPUT instead - `steps.<id>.outputs.<name>` IS
      # allowed in `if:` conditions on later steps.
      - name: Check for signing secret
        id: check_secret
        env:
          KEYSTORE_SECRET: ${{ secrets.SJ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.check_secret.outputs.has_keystore == 'true'
        env:
          KEYSTORE_SECRET: ${{ secrets.SJ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_SECRET" | base64 -d > "${{ runner.temp }}/sj-release.jks"

      - name: Build signed release APK
        if: steps.check_secret.outputs.has_keystore == 'true'
        env:
          SJ_KEYSTORE_PATH: ${{ runner.temp }}/sj-release.jks
          SJ_KEYSTORE_PASSWORD: ${{ secrets.SJ_KEYSTORE_PASSWORD }}
          SJ_KEY_ALIAS: ${{ secrets.SJ_KEY_ALIAS }}
          SJ_KEY_PASSWORD: ${{ secrets.SJ_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release APK artifact
        if: steps.check_secret.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SJPlayerPro-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk
