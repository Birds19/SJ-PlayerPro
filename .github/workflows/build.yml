name: Build SJ Player Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          if [ -f "SJPlayerPro.zip" ]; then
            unzip -o SJPlayerPro.zip -d .
            echo "Unzipped SJPlayerPro.zip"
          else
            echo "SJPlayerPro.zip not found in repo root - assuming source already unzipped"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (no wrapper jar needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SJPlayerPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ secrets.SJ_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SJ_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/sj-release.jks"

      - name: Build signed release APK
        if: ${{ secrets.SJ_KEYSTORE_BASE64 != '' }}
        env:
          SJ_KEYSTORE_PATH: ${{ runner.temp }}/sj-release.jks
          SJ_KEYSTORE_PASSWORD: ${{ secrets.SJ_KEYSTORE_PASSWORD }}
          SJ_KEY_ALIAS: ${{ secrets.SJ_KEY_ALIAS }}
          SJ_KEY_PASSWORD: ${{ secrets.SJ_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release APK artifact
        if: ${{ secrets.SJ_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SJPlayerPro-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk
